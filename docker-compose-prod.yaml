---
services:
  app:
    build:
      dockerfile: docker/prod/app/Dockerfile
    networks:
      - default
    restart: always
    depends_on: ["db"]

  db:
    image: postgres:16.16-alpine3.23@sha256:9cd3f3bf488bc5b8baa92709d87b7dfd903e6f479bddc87052ffc34adcedfa06
    volumes: ["db_data:/var/lib/postgresql/data"]
    networks:
      - default
    environment:
      POSTGRES_DB: todo_baggins
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    restart: always

volumes:
  db_data:
